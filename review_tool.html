<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Our Sports Club</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; text-align: center; max-width: 500px; margin: auto; background-color: #fdfbf7; }
        h2 { color: var(--primary); }
        .star-box { margin: 20px 0; }
        .star { font-size: 45px; cursor: pointer; color: #ccc; transition: color 0.2s; }
        .star.selected { color: #f39c12; }
        #reviewArea { display: none; margin-top: 20px; text-align: left; }
        #reviewText { width: 100%; height: 120px; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .post-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .loading { font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

    <h2>How was your visit?</h2>
    <div class="star-box" id="starContainer">
        <span class="star" onclick="selectStars(1)">★</span>
        <span class="star" onclick="selectStars(2)">★</span>
        <span class="star" onclick="selectStars(3)">★</span>
        <span class="star" onclick="selectStars(4)">★</span>
        <span class="star" onclick="selectStars(5)">★</span>
    </div>

    <div id="reviewArea">
        <p>AI is generating a custom review for you...</p>
        <textarea id="reviewText" placeholder="Your AI-generated review will appear here..."></textarea>
        <button class="post-btn" onclick="postReview()">Copy & Post to Google</button>
    </div>

    <script>
        async function selectStars(count) {
            // UI Update
            document.querySelectorAll('.star').forEach((s, i) => s.className = i < count ? 'star selected' : 'star');
            document.getElementById('reviewArea').style.display = 'block';
            document.getElementById('reviewText').value = "Generating...";

            try {
                // Call the Netlify serverless function
                const response = await fetch('/.netlify/functions/generate-review', {
                    method: 'POST',
                    body: JSON.stringify({ stars: count })
                });
                const data = await response.json();
                document.getElementById('reviewText').value = data.review;
            } catch (error) {
                document.getElementById('reviewText').value = "Sorry, could not generate a review. Please try writing your own.";
            }
        }

        function postReview() {
            const review = document.getElementById('reviewText').value;
            navigator.clipboard.writeText(review);
            alert("Review copied! Now, just paste it into the Google review box that opens next.");
            // REPLACE THIS URL WITH YOUR ACTUAL GOOGLE REVIEW LINK
            window.open("YOUR_GOOGLE_REVIEW_LINK_HERE", "_blank");
        }
    </script>
</body>
</html>
